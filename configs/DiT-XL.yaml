model:
  target: diffusion.models.DiT.DiT
  params:
    input_size: 8
    patch_size: 1
    in_channels: &latent_channels 128
    hidden_size: 1152
    depth: 28
    num_heads: 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: True
  # ckpt: results/dit/001-DiT-Linear-velocity-none-bf16-acc1/checkpoints/0100000.pt

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'uniform'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [*latent_channels, 8, 8] # [C, H, W]
  num_classes: 1000
  time_dist_shift_dim: 8192 # 8*8*128
  time_dist_shift_base: 4096


training:
  global_seed: 0
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 1 # change according to your GPU memory
  ema_decay: 0.9995
  num_workers: 4
  log_every: 100
  ckpt_every: 25000
  sample_every: 10000
  base_lr: 0.0002
  final_lr: 0.00002
  beta: [0.9, 0.95]
  wd: 0.0
  schedule_type: 'linear'
  decay_start_epoch: 40
  decay_end_epoch: 800
  clip_grad: 1.0
